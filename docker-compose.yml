services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/shipnow
      NODE_ENV: production
      LOG_LEVEL: info
      UPLOAD_DIR: uploads
      UPLOAD_MAX_SIZE_MB: 5
      INTERNAL_ENDPOINTS_ENABLED: "false"
      SWAGGER_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - api-logs:/app/logs
      - api-uploads:/app/uploads

volumes:
  mongo-data:
  api-logs:
  api-uploads:
